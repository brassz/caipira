<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Admin · Poker da Galera</title>
<style>
:root{
  --bg:#050505;--bg2:#0D0D0D;--tex:#151515;
  --gold:#D6A83D;--gold-l:#F2CD68;--gold-d:#8A6422;--gold-b:#594015;
  --ink:#E8E5DE;--red:#D62828;--red-d:#8F161B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.wrap{max-width:430px;margin:auto;min-height:100vh;padding:0 0 72px;background:
  radial-gradient(120% 50% at 50% -8%, #151515 0%, transparent 55%), var(--bg)}
@media(min-width:900px){ .wrap{max-width:980px} }
.top{display:flex;align-items:center;gap:10px;padding:10px 12px}
.back{min-height:40px;width:40px;padding:0;border-radius:50%;background:var(--tex);color:var(--ink);border:1px solid var(--gold-b);box-shadow:none}
h1{margin:0;font-size:18px;color:var(--gold-l);flex:1}
.who{margin:0 12px 8px;font-size:12px;color:#A89F8A}
.err{color:#E8A0A0;font-size:13px;min-height:16px;margin:0 12px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 12px 12px;position:sticky;top:0;z-index:8;background:linear-gradient(#050505,#050505ee)}
.tabs button{min-height:40px;padding:8px 4px;font-size:11px;letter-spacing:.4px;background:var(--tex);color:#A89F8A;box-shadow:none;border:1px solid var(--gold-b);border-radius:999px}
.tabs button.on{background:linear-gradient(180deg,var(--gold-l),var(--gold));color:#1a1406;border-color:var(--gold)}
.page{padding:0 12px 16px;display:none}
.page.on{display:block}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:900px){ .cards.tables{grid-template-columns:repeat(3,1fr)} }
.tbox,.card{background:var(--bg2);border:1px solid var(--gold-b);border-radius:16px;padding:12px}
.tbox.on{border-color:var(--gold)}
.tbox b,.card b{display:block;color:var(--gold-l);margin-bottom:4px;font-size:15px}
.muted{color:#A89F8A;font-size:13px}
.row{display:flex;justify-content:space-between;gap:8px;margin:4px 0;font-size:13px}
.row span{color:#A89F8A}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
button{border:0;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer;font-size:13px;min-height:40px}
.ok{background:linear-gradient(180deg,var(--gold-l),var(--gold));color:#1a1406}
.no{background:linear-gradient(180deg,var(--red),var(--red-d));color:#fff}
.sec{background:var(--tex);color:var(--ink);border:1px solid var(--gold-b)}
.gold{background:var(--gold-d);color:var(--ink)}
input{background:var(--tex);color:var(--ink);border:1px solid var(--gold-b);border-radius:10px;padding:10px;min-height:40px;font-size:16px;flex:1;min-width:0}
.pager{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}
.bal{font-weight:800;color:var(--gold-l)}
.pixkey{word-break:break-all;font-size:12px;color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="/"><button class="back" type="button">‹</button></a>
    <h1>Painel admin</h1>
  </div>
  <p class="who" id="who"></p>
  <p class="err" id="err"></p>
  <div class="tabs">
    <button class="on" id="tab-tables" onclick="showTab('tables')">Mesas</button>
    <button id="tab-users" onclick="showTab('users')">Jogadores</button>
    <button id="tab-deps" onclick="showTab('deps')">Depósitos</button>
    <button id="tab-outs" onclick="showTab('outs')">Saques</button>
  </div>
  <div class="page on" id="page-tables"><div class="cards tables" id="tables"></div></div>
  <div class="page" id="page-users"><div id="users"></div><div class="pager" id="pager"></div></div>
  <div class="page" id="page-deps"><div id="deps"></div></div>
  <div class="page" id="page-outs"><div id="outs"></div></div>
</div>
<script>
const token=localStorage.getItem('pdg_token')||'';
const brl=n=>'R$ '+Number(n||0).toFixed(2).replace('.',',');
function statusPt(s){
  const m={ pending:'Pendente', approved:'Aprovado', paid:'Aprovado', rejected:'Cancelado', cancelled:'Cancelado', canceled:'Cancelado' };
  return m[String(s||'').toLowerCase()]||'Pendente';
}
function rolePt(s){
  const m={ admin:'Admin', proplayer:'Pro Player', user:'Jogador' };
  return m[String(s||'').toLowerCase()]||'Jogador';
}
const asArr=d=>!d?[]:Array.isArray(d)?d:[d];
const PAGE=6;
let userPage=0, allUsers=[], tab='tables';
function showTab(name){
  tab=name;
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on', p.id==='page-'+name));
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.id==='tab-'+name));
}
async function api(path, body, method){
  const opt={ method: method||(body?'POST':'GET'), headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+token } };
  if(body) opt.body=JSON.stringify(body);
  const r=await fetch(path,opt);
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||'Erro');
  return j;
}
function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
async function boot(){
  const who=document.getElementById('who');
  if(!token){ who.textContent='Faça login no lobby e abra o Admin de novo.'; return; }
  try {
    let me=await api('/api/me');
    if(Array.isArray(me)) me=me[0];
    if(!me || me.role!=='admin'){
      who.textContent='Sem permissão de admin para '+(me&&me.email||'esta conta')+'.';
      return;
    }
    who.textContent=me.email;
    await loadAll();
  } catch(e){
    who.textContent='Erro: '+(e.message||e);
  }
}
const EMPTY_TABLES=[
  {id:'iniciante',name:'Iniciante',players:0,max:6,seated:[],active:false},
  {id:'mediana',name:'Mediana',players:0,max:6,seated:[],active:false},
  {id:'dificil',name:'Difícil',players:0,max:6,seated:[],active:false},
  {id:'semipro',name:'Semipro',players:0,max:6,seated:[],active:false},
  {id:'profissional',name:'Profissional',players:0,max:6,seated:[],active:false}
];
function renderTables(tables){
  const rows=asArr(tables);
  document.getElementById('tables').innerHTML=(rows.length?rows:EMPTY_TABLES).map(t=>`
    <div class="tbox ${t.active?'on':''}">
      <b>${esc(t.name)}</b>
      <div class="row"><span>Jogadores</span><span>${t.players}/${t.max}</span></div>
      <div class="row"><span>Status</span><span>${t.active?'Ativa':'Vazia'}</span></div>
      <div class="muted">${(t.seated||[]).map(esc).join(', ')||'—'}</div>
    </div>`).join('');
}
async function loadAll(){
  const err=document.getElementById('err');
  err.textContent='';
  try {
    renderTables(await api('/api/admin/tables'));
  } catch(e){ renderTables(EMPTY_TABLES); }
  try {
    allUsers=asArr(await api('/api/admin/users'));
    if(userPage*PAGE>=allUsers.length) userPage=0;
    renderUsers();
  } catch(e){
    document.getElementById('users').innerHTML='<p class="err">'+esc(e.message)+'</p>';
    document.getElementById('pager').innerHTML='';
  }
  try {
    const deps=asArr(await api('/api/admin/deposits'));
    document.getElementById('deps').innerHTML=deps.length?`<div class="cards">${deps.map(d=>`
      <div class="card">
        <b>${brl(d.amount)}</b>
        <div class="row"><span>Conta</span><span>${esc(d.email)}</span></div>
        <div class="row"><span>Status</span><span>${esc(statusPt(d.status))}</span></div>
        <div class="muted">${new Date(d.created_at).toLocaleString()}</div>
      </div>`).join('')}</div>`:'<p class="muted">Nenhum depósito registrado no app. Comprovantes vão pelo WhatsApp.</p>';
  } catch(e){ document.getElementById('deps').innerHTML='<p class="err">'+esc(e.message)+'</p>'; }
  try {
    const outs=asArr(await api('/api/admin/withdrawals'));
    document.getElementById('outs').innerHTML=outs.length?`<div class="cards">${outs.map(w=>`
      <div class="card">
        <b>${brl(w.amount)}</b>
        <div class="row"><span>Conta</span><span>${esc(w.email)}</span></div>
        <div class="row"><span>Status</span><span>${esc(statusPt(w.status))}</span></div>
        <div class="pixkey">${esc(w.pix_key)}</div>
        <div class="muted">${new Date(w.created_at).toLocaleString()}</div>
        ${w.status==='pending'?`<div class="actions">
          <button class="ok" onclick="payOut('${w.id}')">Pagar PIX</button>
          <button class="no" onclick="act('/api/admin/withdrawals/${w.id}/reject')">Estornar</button>
        </div>`:''}
      </div>`).join('')}</div>`:'<p class="muted">Nenhum saque.</p>';
  } catch(e){ document.getElementById('outs').innerHTML='<p class="err">'+esc(e.message)+'</p>'; }
}
function renderUsers(){
  const pages=Math.max(1, Math.ceil(allUsers.length/PAGE));
  const slice=allUsers.slice(userPage*PAGE, userPage*PAGE+PAGE);
  document.getElementById('users').innerHTML=slice.length?`<div class="cards">${slice.map(u=>`
    <div class="card">
      <b>${esc(u.username)}</b>
      <div class="muted">${esc(u.email)}</div>
      <div class="row"><span>Papel</span><span>${esc(rolePt(u.role))}</span></div>
      <div class="row"><span>Saldo</span><span class="bal">${brl(u.balance)}</span></div>
      <div class="actions">
        <input id="a-${u.id}" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Valor R$">
        <button class="ok" onclick="adjust('${u.id}',1)">+</button>
        <button class="gold" onclick="adjust('${u.id}',-1)">−</button>
        ${u.role==='admin'?'':(u.role==='proplayer'
          ? `<button class="sec" onclick="setRole('${u.id}','user')">Tirar Pro</button>`
          : `<button class="gold" onclick="setRole('${u.id}','proplayer')">Pro Player</button>`)}
        <button class="no" onclick="delUser('${u.id}','${esc(u.username)}')">Excluir</button>
      </div>
    </div>`).join('')}</div>`:'<p class="muted">Nenhum jogador.</p>';
  document.getElementById('pager').innerHTML=`
    <span class="muted">${allUsers.length} jogadores · ${userPage+1}/${pages}</span>
    <button class="sec" ${userPage<=0?'disabled':''} onclick="userPage--;renderUsers()">Anterior</button>
    <button class="sec" ${userPage>=pages-1?'disabled':''} onclick="userPage++;renderUsers()">Próxima</button>`;
}
async function adjust(id, sign){
  const raw=(document.getElementById('a-'+id).value||'').replace(',','.');
  const v=Number(raw);
  if(!v || v<=0){ alert('Informe o valor.'); return; }
  try { await api('/api/admin/balance',{ userId:id, delta: sign*v }); await loadAll(); }
  catch(e){ alert(e.message); }
}
async function setRole(id, role){
  try { await api('/api/admin/users/'+id+'/role',{ role }); await loadAll(); }
  catch(e){ alert(e.message); }
}
async function delUser(id, name){
  if(!confirm('Excluir o jogador '+name+'? Esta ação não tem volta.')) return;
  try { await api('/api/admin/users/'+id+'/delete',{}); await loadAll(); }
  catch(e){ alert(e.message); }
}
async function payOut(id){
  const document = prompt('CPF/CNPJ do dono da chave PIX (obrigatório para e-mail, telefone ou aleatória):') || '';
  try { await api('/api/admin/withdrawals/'+id+'/pay', { document }); await loadAll(); }
  catch(e){ alert(e.message); }
}
async function act(path){
  try { await api(path,{}); await loadAll(); } catch(e){ alert(e.message); }
}
boot();
setInterval(()=>{ if(allUsers.length||document.getElementById('tables').children.length) loadAll().catch(()=>{}); }, 8000);
</script>
</body>
</html>
