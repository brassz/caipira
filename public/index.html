<script>
const TABLES = [
  {id:'iniciante', name:'Iniciante', buy:10, blinds:'0,25 / 0,50'},
  {id:'mediana', name:'Mediana', buy:25, blinds:'0,50 / 1,00'},
  {id:'dificil', name:'Difícil', buy:55, blinds:'1,00 / 2,00'},
  {id:'semipro', name:'Semipro', buy:100, blinds:'2,00 / 5,00'},
  {id:'profissional', name:'Profissional', buy:200, blinds:'5,00 / 10,00'}
];
function tableThumb(t){
  return `<img src="/assets/tables/${t.id}.png" alt="${t.name}">`;
}
const AVATARS = ['01','02','03','04','05','06','07','08','09','10','11','12'];
function avatarSrc(id){
  const n = String(id||'01').replace(/\D/g,'').padStart(2,'0');
  return '/assets/avatars/'+(AVATARS.includes(n)?n:'01')+'.png';
}
const brl = n => 'R$ ' + Number(n||0).toFixed(2).replace('.',',');
function statusPt(s){
  const m = { pending:'Pendente', approved:'Aprovado', paid:'Aprovado', rejected:'Cancelado', cancelled:'Cancelado', canceled:'Cancelado' };
  return m[String(s||'').toLowerCase()] || 'Pendente';
}
let token=localStorage.getItem('pdg_token')||'', profile=null, rulesRead=false, rulesAccepted=false, authMode='splash', liveSeats={}, lobbyTimer=null, screen='lobby', pickAmt=0;
let settings = (function(){
  try { return Object.assign({sound:true, notify:true, vibrate:true, music:true, musicVol:35}, JSON.parse(localStorage.getItem('pdg_settings')||'{}')); }
  catch(_){ return {sound:true, notify:true, vibrate:true, music:true, musicVol:35}; }
})();
function persistSettings(){
  localStorage.setItem('pdg_settings', JSON.stringify(settings));
  if(window.PDGMusic) PDGMusic.apply();
}
function beep(){
  if(!settings.sound) return;
  try {
    const c = new (window.AudioContext||window.webkitAudioContext)();
    const o = c.createOscillator(); const g = c.createGain();
    o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0.06, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+0.09);
    o.start(); o.stop(c.currentTime+0.09);
  } catch(_){}
}
function buzz(){ if(settings.vibrate && navigator.vibrate) navigator.vibrate(18); }
function ping(title, body){
  if(!settings.notify || !('Notification' in window) || Notification.permission!=='granted') return;
  try { new Notification(title, { body: body||'', icon:'/assets/logo.png' }); } catch(_){}
}
async function api(path, body, method){
  const opt={ method: method|| (body?'POST':'GET'), headers:{ 'Content-Type':'application/json' } };
  if(token) opt.headers.Authorization='Bearer '+token;
  if(body) opt.body=JSON.stringify(body);
  const r=await fetch(path, opt);
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||'Erro');
  return j;
}

function rulesHtml(){
  return `<h3>1. Aceitação</h3>
<p>Ao criar conta, entrar ou jogar no Poker da Galera, você declara ter lido, entendido e aceito estas regras na íntegra. Se não concordar, não utilize a plataforma.</p>
<h3>2. Idade e responsabilidade</h3>
<ul>
<li>O acesso é exclusivo para maiores de 18 anos.</li>
<li>Você é responsável por todas as ações feitas na sua conta.</li>
<li>Jogue apenas com dinheiro que pode perder. A plataforma não se responsabiliza por prejuízos de jogo.</li>
</ul>
<h3>3. Jogo limpo — trapaça é proibida</h3>
<p>É estritamente proibido qualquer tipo de trapaça, fraude ou conduta desleal, incluindo:</p>
<ul>
<li>Uso de bots, scripts, solvers em tempo real, HUDs não autorizados ou qualquer software de assistência.</li>
<li>Colusão: dois ou mais jogadores combinando jogadas, sinais, chip dumping ou divisão combinada de potes.</li>
<li>Multiaccounting: criar ou usar mais de uma conta, contas de terceiros ou contas para se beneficiar em mesas.</li>
<li>Compartilhar cartas, prints da mão ou informação privilegiada com quem está na mesma mesa.</li>
<li>Explorar bugs, falhas de conexão, atraso proposital ou qualquer erro do sistema em benefício próprio.</li>
<li>Manipular resultados, fingir desconexão para fugir de apostas ou prejudicar a mesa.</li>
<li>Usar linguagem ofensiva, ameaça, assédio, racismo, preconceito ou intimidação.</li>
</ul>
<h3>4. Conduta na mesa</h3>
<ul>
<li>Respeite os tempos de ação. Abandono repetido pode gerar kick ou bloqueio.</li>
<li>Não é permitido combinar fold, check ou raise com outros jogadores.</li>
<li>O jogo é <b>Omaha 5 (PLO5)</b>, limite pote: cada jogador recebe 5 cartas fechadas e o board tem 5 comunitárias (flop 3, turn 1, river 1).</li>
<li>A combinação válida é sempre <b>exatamente 2 cartas da mão + exatamente 3 comunitárias</b>. Não vale usar 1 ou 3 da mão.</li>
<li>Aposta máxima é o tamanho do pote (pot-limit). All-in só quando a stack cabe no pote ou é menor que o máximo.</li>
<li>Blinds, ordem de ação, check, call, raise e ruas seguem o Omaha 5 padrão. A decisão do sistema prevalece.</li>
</ul>
<h3>5. Conta, saldo, PIX, depósitos e saques</h3>
<ul>
<li>O saldo da conta é de uso exclusivo do titular.</li>
<li>Depósitos via PIX exigem comprovante enviado pelo WhatsApp (16) 99295-4354. O crédito só ocorre após conferência da equipe.</li>
<li>Comprovante falso, valor divergente ou PIX de terceiro sem identificação pode ser recusado e a conta bloqueada.</li>
<li>Saques exigem chave PIX válida do titular. O pedido retém o valor e o pagamento é processado após o prazo informado, com confirmação da equipe.</li>
<li>A plataforma pode reter, estornar ou cancelar valores ligados a fraude, chargeback, conta irregular ou violação destas regras.</li>
</ul>
<h3>6. Penalidades</h3>
<p>Em caso de violação, a equipe pode, sem aviso prévio:</p>
<ul>
<li>Advertir, suspender ou banir a conta de forma permanente.</li>
<li>Confiscar saldo, fichas em mesa, depósitos pendentes e saques.</li>
<li>Anular mãos, potes ou resultados obtidos de forma irregular.</li>
<li>Recusar novos cadastros do mesmo CPF, e-mail, dispositivo ou PIX.</li>
</ul>
<h3>7. Equipe e decisões</h3>
<ul>
<li>A administração do Poker da Galera tem a palavra final em denúncias, mesas, saldo e cadastros.</li>
<li>Falhas técnicas devem ser reportadas. Usar falha de propósito é violação grave.</li>
<li>Estas regras podem ser atualizadas. O uso contínuo após alteração implica aceitação.</li>
</ul>
<p><b>Ao marcar “Li e aceito”, você concorda em jogar limpo, sem trapaças, e assume as consequências de qualquer infração.</b></p>`;
}

function applyLoginArt(){
  const screen = document.querySelector('.auth-screen');
  const img = document.getElementById('logo');
  const overlay = 'linear-gradient(180deg,#05050566 0%,#05050588 42%,#050505ee 100%)';
  const desktop = '/assets/login-bg.png';
  const mobile = '/assets/login-bg-mobile.png';
  const useMobile = window.matchMedia('(max-width: 900px), (orientation: portrait)').matches;
  const paint = (src) => {
    if(!screen) return;
    screen.style.backgroundImage = overlay+',url("'+src+'")';
    screen.style.backgroundSize = 'cover';
    screen.style.backgroundPosition = 'center';
    screen.style.backgroundRepeat = 'no-repeat';
  };
  if(useMobile){
    const probe = new Image();
    probe.onload = () => paint(mobile);
    probe.onerror = () => paint(desktop);
    probe.src = mobile;
  } else paint(desktop);
  if(img){
    if(useMobile){ img.removeAttribute('src'); img.style.display='none'; }
    else { img.src='/assets/logo.png'; img.onerror=()=>{ img.style.display='none'; }; }
  }
}
async function refresh(){
  if(!token){ renderAuth(); return; }
  try {
    profile = await api('/api/me');
    if(window.PDGMusic) PDGMusic.start();
    renderLobby();
  } catch(e) {
    token=''; localStorage.removeItem('pdg_token');
    renderAuth();
  }
}

function renderAuth(){
  const app = document.getElementById('app');
  app.className = 'auth-page';
  if(authMode==='splash'){
    app.innerHTML = `<div class="auth-screen"><div class="xp-login">
      <img id="logo" class="logo" alt="Poker da Galera">
      <h1>POKER DA GALERA</h1>
      <p class="sub">CASH GAME</p>
      <button style="width:100%" onclick="authMode='login';renderAuth()">Entrar</button>
      <p class="muted" style="margin-top:16px">Novo por aqui? <a href="#" onclick="authMode='signup';renderAuth();return false;" style="color:#F2CD68">Criar conta</a></p>
      <div class="err" id="err"></div>
    </div></div>`;
    applyLoginArt();
    return;
  }
  const signup = authMode==='signup';
  app.innerHTML = `<div class="auth-screen">
    <div class="auth mail-sheet">
    <button class="back" type="button" onclick="authMode='splash';renderAuth()">‹</button>
    <img id="logo" class="logo" alt="Poker da Galera">
    <div class="tag">${signup?'CRIAR CONTA':'E-MAIL'}</div>
    ${signup?`<input id="user" placeholder="Nome de usuário" maxlength="18" autocomplete="username">`:''}
    <input id="email" type="email" placeholder="E-mail" autocomplete="email">
    <input id="pass" type="password" placeholder="Senha" autocomplete="${signup?'new-password':'current-password'}">
    ${signup?`
    <label class="checkline"><input type="checkbox" id="age"> Tenho 18 anos ou mais</label>
    <button class="sec" type="button" onclick="openRules()" style="width:100%">Ler regras da plataforma</button>
    <label class="checkline"><input type="checkbox" id="rules"> Li e aceito as regras da plataforma</label>
    `:''}
    <div class="err" id="err"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      ${signup
        ? `<button onclick="signup()" style="flex:1">Cadastrar</button>`
        : `<button onclick="login()" style="flex:1">Entrar</button>`}
    </div>
    <div class="modal" id="rulesModal"><div class="box rules">
      <h3 style="margin:0 0 8px;color:#F2CD68">Regras da plataforma</h3>
      <div class="rules-body" id="rulesBody">${rulesHtml()}</div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="ok" onclick="acceptRules()">Li e aceito</button>
        <button class="sec" onclick="closeRules()">Fechar</button>
      </div>
    </div></div>
  </div>
  </div>`;
  if(signup) syncRulesCheck();
  applyLoginArt();
}
function openRules(){
  rulesRead = true;
  $('rulesModal').classList.add('show');
}
function closeRules(){ $('rulesModal').classList.remove('show'); }
function acceptRules(){
  rulesRead = true;
  rulesAccepted = true;
  $('rules').checked = true;
  closeRules();
}
function syncRulesCheck(){
  const el = $('rules');
  if(!el) return;
  el.onchange = () => {
    if(el.checked && !rulesRead){
      el.checked = false;
      $('err').textContent = 'Abra e leia as regras antes de aceitar.';
      openRules();
      return;
    }
    rulesAccepted = el.checked;
  };
}
async function login(){
  const email = ($('email').value||'').trim();
  const password = $('pass').value||'';
  if(!email || !password){ $('err').textContent='Informe e-mail e senha.'; return; }
  try {
    const data = await api('/api/login', { email, password });
    token = data.token; localStorage.setItem('pdg_token', token);
    profile = data.user; if(window.PDGMusic) PDGMusic.start(); renderLobby();
  } catch(e) { $('err').textContent = e.message; }
}
async function signup(){
  const username = ($('user').value||'').trim();
  const email = ($('email').value||'').trim();
  const password = $('pass').value||'';
  if(!username){ $('err').textContent='Informe o nome de usuário.'; return; }
  if(!email){ $('err').textContent='Informe o e-mail.'; return; }
  if(password.length < 6){ $('err').textContent='A senha deve ter pelo menos 6 caracteres.'; return; }
  if(!$('age').checked){ $('err').textContent='Confirme que tem 18 anos.'; return; }
  if(!rulesRead || !$('rules').checked){ $('err').textContent='Leia e aceite as regras da plataforma para se cadastrar.'; openRules(); return; }
  try {
    const data = await api('/api/register', { email, username, password });
    if(data.token){ token=data.token; localStorage.setItem('pdg_token', token); profile=data.user; renderLobby(); return; }
    authMode='login'; renderAuth();
    $('err').textContent='Conta criada. Entre com e-mail e senha.';
  } catch(e) { $('err').textContent = e.message; }
}
function $(id){ return document.getElementById(id); }

function navHtml(active){
  return `<div class="nav">
    <button class="${active==='lobby'?'on':''}" onclick="go('lobby')"><b>♠</b>Mesas</button>
    <button class="${active==='wallet'?'on':''}" onclick="go('wallet')"><b>♦</b>Carteira</button>
    <button class="${active==='profile'?'on':''}" onclick="go('profile')"><b>♥</b>Eu</button>
  </div>
  <div class="modal" id="rulesModal"><div class="box rules">
    <h3 style="margin:0 0 8px;color:#F2CD68">Regras da plataforma</h3>
    <div class="rules-body">${rulesHtml()}</div>
    <div style="margin-top:12px"><button class="sec" onclick="document.getElementById('rulesModal').classList.remove('show')">Fechar</button></div>
  </div></div>`;
}
function topBar(){
  const av = avatarSrc(profile && profile.avatar);
  return `<div class="xp-top">
    <button class="xp-me" onclick="go('profile')" style="background:#0D0D0Dcc">
      <img src="${av}" alt="">
      <div class="nm">${esc(profile&&profile.username||'Jogador')}<small>Meu perfil</small></div>
    </button>
    <div class="xp-chip">♣ <b id="saldoVal">${brl(profile&&profile.balance)}</b></div>
    <button class="xp-plus" onclick="go('deposit')">+</button>
  </div>`;
}
function go(name){
  beep(); buzz();
  screen = name;
  if(name==='lobby') renderLobby();
  else if(name==='wallet') renderWallet();
  else if(name==='deposit') renderDeposit();
  else if(name==='withdraw') renderWithdraw();
  else if(name==='profile') renderProfile();
  else if(name==='settings') renderSettings();
}
function renderLobby(){
  screen='lobby';
  const app = document.getElementById('app');
  app.className = 'wrap';
  app.innerHTML = `${topBar()}
    <div class="xp-tabs">
      <button class="on">CASH GAME</button>
    </div>
    <div class="xp-sec"><h2>SALAS AO VIVO</h2><span>6 max · PLO5</span></div>
    <div id="rooms">${roomCards()}</div>
    ${navHtml('lobby')}`;
  if(new URLSearchParams(location.search).get('add')==='1'){
    history.replaceState({},'', '/');
    setTimeout(()=>go('deposit'), 40);
  }
  loadLiveSeats();
  if(lobbyTimer) clearInterval(lobbyTimer);
  lobbyTimer=setInterval(()=>{ if(screen==='lobby') loadLiveSeats(); }, 5000);
}
function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function roomCards(){
  return TABLES.map(t=>{
    const n = Number((liveSeats[t.id]&&liveSeats[t.id].players)||0);
    const dots = Array.from({length:6},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('');
    return `<div class="room">
      <div class="oval">${n>0?'<span class="live">LIVE</span>':''}${tableThumb(t)}</div>
      <div>
        <h3>${t.name}</h3>
        <div class="meta">Blinds ${t.blinds}</div>
        <div class="seats">${dots}</div>
      </div>
      <div class="rjoin">
        <div class="buy">${brl(t.buy)}<span>BUY-IN</span></div>
        <button onclick="sit('${t.id}',${t.buy})">ENTRAR</button>
      </div>
    </div>`;
  }).join('');
}
async function loadLiveSeats(){
  try {
    const rows = await api('/api/lobby');
    const list = Array.isArray(rows)?rows:[];
    liveSeats = {};
    list.forEach(r=>{ liveSeats[r.id]=r; });
    const el=$('rooms');
    if(el) el.innerHTML=roomCards();
  } catch(_){}
}
function renderWallet(){
  const app = document.getElementById('app');
  app.className = 'wrap';
  app.innerHTML = `${topBar()}
    <div class="page">
      <div class="ph"><h1>Carteira</h1></div>
      <div class="bal-card">
        <div class="lbl">SALDO DISPONÍVEL</div>
        <div class="val">${brl(profile&&profile.balance)}</div>
      </div>
      <div class="act2">
        <button class="ok" onclick="go('deposit')">Depósito</button>
        <button class="sec" onclick="go('withdraw')">Saque</button>
      </div>
      <p class="muted">Histórico</p>
      <div id="hist"></div>
    </div>
    ${navHtml('wallet')}`;
  loadHist();
}
function renderDeposit(){
  pickAmt = pickAmt || 10;
  const presets = [10,25,50,100,200];
  const app = document.getElementById('app');
  app.className = 'wrap';
  app.innerHTML = `${topBar()}
    <div class="page">
      <div class="ph"><button class="back" onclick="go('wallet')">‹</button><h1>Depósito PIX</h1></div>
      <div class="bal-card">
        <div class="lbl">DEPÓSITO MÍNIMO R$ 10,00</div>
        <div class="val" id="depShow">${brl(pickAmt)}</div>
      </div>
      <div class="quick">${presets.map(v=>`<button class="${v===pickAmt?'on':''}" onclick="setDep(${v})">${brl(v)}</button>`).join('')}</div>
      <input id="depAmt" type="number" min="10" step="0.01" value="${pickAmt}" placeholder="Outro valor (R$)" oninput="pickAmt=Number(this.value)||0; const s=$('depShow'); if(s) s.textContent=brl(pickAmt)">
      <input id="depCpf" placeholder="CPF" inputmode="numeric">
      <div class="err" id="werr"></div>
      <button class="ok" style="width:100%" onclick="createPixCharge()">Gerar PIX</button>
    </div>
    ${navHtml('wallet')}`;
}
function setDep(v){ pickAmt=v; renderDeposit(); }
function renderWithdraw(){
  const app = document.getElementById('app');
  app.className = 'wrap';
  app.innerHTML = `${topBar()}
    <div class="page">
      <div class="ph"><button class="back" onclick="go('wallet')">‹</button><h1>Saque PIX</h1></div>
      <div class="bal-card">
        <div class="lbl">SALDO</div>
        <div class="val">${brl(profile&&profile.balance)}</div>
      </div>
      <p class="err" style="min-height:auto">Saque mínimo R$ 15,00</p>
      <input id="pixOut" placeholder="Sua chave PIX">
      <input id="outCpf" placeholder="CPF do titular da chave" inputmode="numeric">
      <input id="outAmt" type="number" min="15" step="0.01" placeholder="Valor (R$)">
      <div class="err" id="werr"></div>
      <button class="ok" style="width:100%" onclick="sendWithdraw()">Sacar via PIX</button>
    </div>
    ${navHtml('wallet')}`;
}
function renderProfile(){
  const cur = String(profile&&profile.avatar||'01').padStart(2,'0');
  const app = document.getElementById('app');
  app.className = 'wrap';
  app.innerHTML = `${topBar()}
    <div class="page">
      <div class="prof-hero">
        <img src="${avatarSrc(cur)}" alt="">
        <h3 style="margin:8px 0 0;color:#F2CD68">${esc(profile&&profile.username||'Jogador')}</h3>
        <p class="muted" style="margin:4px 0">${esc(profile&&profile.email||'')}</p>
      </div>
      <input id="profName" maxlength="18" value="${esc(profile&&profile.username||'')}" placeholder="Apelido">
      <p class="muted">Escolha um avatar</p>
      <div class="avgrid">${AVATARS.map(id=>`<button type="button" class="${id===cur?'on':''}" onclick="pickAvatar('${id}')"><img src="${avatarSrc(id)}" alt=""></button>`).join('')}</div>
      <div class="err" id="perr"></div>
      <button class="ok" style="width:100%" onclick="saveProfile()">Salvar perfil</button>
      <div class="menu">
        ${profile && profile.role==='admin' ? `<button onclick="location.href='/admin.html'">Painel admin <span>›</span></button>` : ''}
        <button onclick="go('settings')">Configurações <span>›</span></button>
        <button onclick="openRulesLobby()">Regras <span>›</span></button>
      </div>
      <button class="danger" style="width:100%;margin-top:12px" onclick="logout()">Sair da conta</button>
    </div>
    ${navHtml('profile')}`;
}
function pickAvatar(id){
  if(profile) profile.avatar = id;
  renderProfile();
}
async function saveProfile(){
  try {
    const username = ($('profName').value||'').trim();
    profile = await api('/api/profile', { username, avatar: profile.avatar||'01' });
    ping('Perfil', 'Avatar e apelido salvos');
    go('lobby');
  } catch(e){ const el=$('perr'); if(el) el.textContent=e.message; }
}
function renderSettings(){
  const app = document.getElementById('app');
  app.className = 'wrap';
  const vol = Math.round(Number(settings.musicVol!=null?settings.musicVol:35));
  const track = window.PDGMusic ? PDGMusic.trackName() : '';
  app.innerHTML = `${topBar()}
    <div class="page">
      <div class="ph"><button class="back" onclick="go('profile')">‹</button><h1>Configurações</h1></div>
      <div class="rowset">
        <div class="item">Música de fundo<button class="sw ${settings.music?'on':''}" onclick="toggleSet('music')"><i></i></button></div>
        <div class="item">Volume
          <input class="vol" id="volMusic" type="range" min="0" max="100" value="${vol}" oninput="setMusicVol(this.value)">
        </div>
        <div class="item">Faixa<p class="trackn">${esc(track||'—')}</p>
          <span><button class="sec" style="min-height:36px;padding:6px 10px;display:inline-block;width:auto" onclick="skipMusic(-1)">‹</button>
          <button class="sec" style="min-height:36px;padding:6px 10px;display:inline-block;width:auto" onclick="skipMusic(1)">›</button></span>
        </div>
        <div class="item">Sons do app<button class="sw ${settings.sound?'on':''}" onclick="toggleSet('sound')"><i></i></button></div>
        <div class="item">Notificações<button class="sw ${settings.notify?'on':''}" onclick="toggleSet('notify')"><i></i></button></div>
        <div class="item">Vibração<button class="sw ${settings.vibrate?'on':''}" onclick="toggleSet('vibrate')"><i></i></button></div>
      </div>
      <p class="muted">A playlist toca pelo YouTube em loop. Use o interruptor e o volume. <a href="https://www.youtube.com/watch?v=CoJxgs3yneI&list=PLAPpNTL9QCDvosgGmDoN0v8YwDFtBBo1n" target="_blank" rel="noopener" style="color:#F2CD68">Ver no YouTube</a></p>
    </div>
    ${navHtml('profile')}`;
}
function setMusicVol(v){
  settings.musicVol = Number(v);
  if(settings.musicVol>0) settings.music = true;
  persistSettings();
}
function skipMusic(dir){
  settings.music = true;
  persistSettings();
  if(window.PDGMusic){ if(dir<0) PDGMusic.prev(); else PDGMusic.next(); }
  renderSettings();
}
async function toggleSet(key){
  if(key==='notify' && !settings.notify && 'Notification' in window){
    const p = await Notification.requestPermission();
    settings.notify = p==='granted';
  } else settings[key] = !settings[key];
  persistSettings();
  if(key==='music' && settings.music && window.PDGMusic) PDGMusic.start();
  beep(); buzz();
  renderSettings();
}
function openRulesLobby(){ const el=document.getElementById('rulesModal'); if(el) el.classList.add('show'); }

function sit(id, buy){
  if(!profile || Number(profile.balance) < buy){ go('deposit'); return; }
  beep();
  location.href = '/game.html?table='+id;
}

function openWallet(){ go('wallet'); }
function walletView(mode){
  if(mode==='add') go('deposit');
  else if(mode==='out') go('withdraw');
  else go('wallet');
}
let pixPoll = null;
async function createPixCharge(){
  const amount = Number(($('depAmt')&&$('depAmt').value) || pickAmt);
  const document = ($('depCpf') && $('depCpf').value || '').replace(/\D/g,'');
  const errEl = $('werr'); if(errEl) errEl.textContent = '';
  try {
    const r = await api('/api/pix', { amount, document });
    showPixPay(r);
  } catch(e) { if($('werr')) $('werr').textContent = e.message; }
}
function pixQrSrc(qr){
  const s = String(qr||'').trim();
  if(!s) return '';
  if(/^https?:\/\//i.test(s) || s.startsWith('data:')) return s;
  return 'data:image/png;base64,'+s.replace(/^data:image\/\w+;base64,/,'');
}
function showPixPay(r){
  if(pixPoll) clearInterval(pixPoll);
  const qr = pixQrSrc(r.qr);
  const app = document.getElementById('app');
  app.className = 'wrap';
  app.innerHTML = `${topBar()}
    <div class="page">
      <div class="ph"><button class="back" onclick="stopPixPoll();go('deposit')">‹</button><h1>Pague o PIX</h1></div>
      ${qr?`<div class="qrbox"><img alt="QR PIX" src="${qr}"></div>`:''}
      <p class="muted" style="text-align:center">Copie o código e pague no app do banco.</p>
      <div class="pix" id="pixCopy">${r.copyPaste||''}</div>
      <button class="ok" style="width:100%" onclick="navigator.clipboard.writeText($('pixCopy').textContent);beep()">Copiar código</button>
      <div class="err" id="werr"></div>
      <p class="muted" id="pixSt" style="text-align:center">Aguardando pagamento…</p>
    </div>
    ${navHtml('wallet')}`;
  pixPoll = setInterval(()=>checkPix(r.id), 2500);
}
function stopPixPoll(){ if(pixPoll){ clearInterval(pixPoll); pixPoll=null; } }
async function checkPix(id){
  try {
    const s = await api('/api/pix/status/'+id);
    if(s.status==='approved'){
      stopPixPoll();
      if(s.balance!=null) profile.balance = s.balance;
      ping('Depósito confirmado', brl(profile.balance));
      beep();
      const app = document.getElementById('app');
      app.className = 'wrap';
      app.innerHTML = `${topBar()}
        <div class="page">
          <div class="bal-card"><div class="lbl">PAGAMENTO CONFIRMADO</div><div class="val">${brl(profile.balance)}</div></div>
          <button class="ok" style="width:100%" onclick="go('lobby')">Ir às mesas</button>
        </div>
        ${navHtml('wallet')}`;
    }
  } catch(e) { const el=$('werr'); if(el) el.textContent=e.message; }
}
async function sendWithdraw(){
  const amount = Number($('outAmt').value);
  const pixKey = ($('pixOut').value||'').trim();
  let cpf = ($('outCpf') && $('outCpf').value || '').replace(/\D/g,'');
  const keyDigits = pixKey.replace(/\D/g,'');
  if(cpf.length!==11 && cpf.length!==14 && (keyDigits.length===11 || keyDigits.length===14)) cpf = keyDigits;
  const errEl = $('werr'); if(errEl) errEl.textContent = '';
  try {
    const r = await api('/api/withdraw', { amount, pixKey, document: cpf });
    if(r.balance!=null) profile.balance = r.balance;
    ping('Saque enviado', brl(amount));
    beep();
    const app = document.getElementById('app');
    app.className = 'wrap';
    app.innerHTML = `${topBar()}
      <div class="page">
        <div class="bal-card"><div class="lbl">SAQUE ENVIADO</div><div class="val">${brl(amount)}</div></div>
        <p class="muted" style="text-align:center">PIX disparado pela CajuPay. Saldo ${brl(profile.balance)}</p>
        <button class="ok" style="width:100%" onclick="go('wallet')">Ok</button>
      </div>
      ${navHtml('wallet')}`;
  } catch(e) {
    const el = $('werr');
    if(el) el.textContent = e.message;
    else alert(e.message);
  }
}
async function loadHist(){
  try {
    const h = await api('/api/history');
    const el = $('hist');
    if(!el) return;
    const deps = (h.deposits||[]).map(x=>`<div class="hist-item"><span>Depósito · ${statusPt(x.status)}</span><b>${brl(x.amount)}</b></div>`).join('');
    const outs = (h.withdrawals||[]).map(x=>`<div class="hist-item out"><span>Saque · ${statusPt(x.status)}</span><b>${brl(x.amount)}</b></div>`).join('');
    el.innerHTML = deps+outs || '<p class="muted">Nenhum movimento ainda.</p>';
  } catch(e) { const el=$('hist'); if(el) el.innerHTML=''; }
}
async function logout(){
  try { await api('/api/logout', {}); } catch(_){}
  token=''; localStorage.removeItem('pdg_token'); location.reload();
}
refresh();
</script>
