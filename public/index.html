<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Omaha 5</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#070b14;color:#fff;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;max-width:980px;margin:auto}

.topbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(#141c2e,#0b101c);border-bottom:1px solid #2a3550;z-index:3}
.brand{font-weight:800;letter-spacing:.5px;color:#ffd24a;font-size:15px}
.meta{font-size:12px;color:#9db0c8;flex:1}
.money{color:#ffd24a;font-weight:700}
.status{font-size:12px;color:#8fd3b0}

.lobby{padding:14px;background:#10182a}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,button{border:0;border-radius:10px;padding:10px 12px;font-size:14px}
input{flex:1;min-width:110px;background:#1b2438;color:#fff;outline:none}
button{background:#f0c33a;color:#1a1406;font-weight:800;cursor:pointer}
button.secondary{background:#2d6adf;color:#fff}
button.ok{background:#1fa65a;color:#fff}
button.danger{background:#d23b3b;color:#fff}
button.ghost{background:#243049;color:#dbe6f5}
button:disabled{opacity:.38;cursor:default}

.stage{flex:1;position:relative;min-height:0}
.felt-wrap{position:absolute;inset:8px 8px 118px}
.rail{
  width:100%;height:100%;
  border-radius:50%;
  background:
    radial-gradient(ellipse at 50% 18%, #d4a45a 0 8%, transparent 22%),
    linear-gradient(180deg,#8a5a28,#5a3816 40%,#3d250e);
  padding:18px;
  box-shadow:0 18px 40px #000a, inset 0 2px 0 #e6c27a88;
}
.felt{
  width:100%;height:100%;
  border-radius:50%;
  position:relative;
  background:
    radial-gradient(ellipse at 50% 42%, #1f8a55 0%, #0f5c38 42%, #083d26 78%, #052818 100%);
  box-shadow:inset 0 0 0 3px #c9a35a55, inset 0 0 70px #0008;
  overflow:hidden;
}
.felt-logo{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
  font-size:clamp(22px,5vw,42px);font-weight:900;letter-spacing:3px;
  color:#ffffff12;text-shadow:0 2px 0 #0003;pointer-events:none;
}
.pot{
  position:absolute;left:50%;top:28%;transform:translate(-50%,-50%);
  min-width:90px;text-align:center;background:#0007;border:1px solid #e7c56a66;
  border-radius:16px;padding:4px 12px;font-size:13px;color:#ffe08a;z-index:2;
}
.board{
  position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);
  display:flex;gap:4px;z-index:2;
}

.seat{
  position:absolute;width:92px;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;z-index:3;
}
.seat.empty .avatar{background:#0b1220aa;border-color:#3a4a63;color:#4d5d78}
.avatar{
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(180deg,#3a6aa8,#1d3f6e);
  border:3px solid #d7b15a;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;box-shadow:0 4px 10px #0009;
}
.seat.me .avatar{border-color:#fff;box-shadow:0 0 0 2px #f0c33a,0 4px 10px #0009}
.seat.win .avatar{border-color:#7dff9a;box-shadow:0 0 16px #3dff7a}
.seat.fold{opacity:.45}
.clock{
  position:relative;width:60px;height:60px;border-radius:50%;padding:3px;
  background:conic-gradient(var(--c,#3dff7a) calc(var(--p,100)*1%), #ffffff22 0);
  display:flex;align-items:center;justify-content:center;
}
.clock .avatar{width:50px;height:50px;margin:0;border-width:2px}
.clock-num{
  position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;
  background:#0b0f18;border:2px solid var(--c,#3dff7a);color:#fff;
  font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px #000a;
}
.clock.green{--c:#3dff7a}
.clock.orange{--c:#ff9f1a}
.clock.red{--c:#ff3b3b}
.plate{
  margin-top:-8px;background:#0b0f18ee;border:1px solid #d7b15a77;border-radius:8px;
  padding:3px 7px;min-width:86px;text-align:center;font-size:11px;line-height:1.25;
}
.plate b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
.chips{color:#ffd24a;font-weight:700}
.mini-cards{display:flex;gap:1px;margin-top:3px;height:28px}
.seat-cards .card{width:18px;height:26px;font-size:8px;padding:1px;border-radius:3px}

.s0{left:50%;top:88%}
.s1{left:84%;top:72%}
.s2{left:86%;top:32%}
.s3{left:50%;top:12%}
.s4{left:14%;top:32%}
.s5{left:16%;top:72%}

.card{
  width:42px;height:60px;background:#f7f3ea;color:#161616;border-radius:6px;
  padding:3px 4px;font-weight:800;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 3px 6px #0008;font-size:12px;flex:0 0 auto;
}
.card .suit{font-size:18px;text-align:center;line-height:1}
.red{color:#d21f1f}
.back{
  background:repeating-linear-gradient(45deg,#1a3f86,#1a3f86 6px,#2450a6 6px,#2450a6 12px);
  border:2px solid #c9d8ff;color:#fff;justify-content:center;align-items:center;font-size:8px;
}

.hero{
  position:absolute;left:50%;bottom:128px;transform:translateX(-50%);
  display:flex;gap:3px;z-index:4;
}
.hero .card{width:52px;height:74px;font-size:14px}
.hero .card .suit{font-size:22px}

.bottom{
  position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(#0000,#070b14 28%);
  padding:8px 10px 10px;z-index:5;
}
.betrow{display:flex;gap:8px;margin-bottom:8px}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.actions button{min-width:110px;padding:11px 10px;border-radius:22px;font-size:12px}

.log{
  position:absolute;left:8px;top:8px;width:min(240px,42vw);max-height:22%;
  overflow:auto;background:#0006;border-radius:8px;padding:6px;font-size:11px;
  color:#c9d7ea;z-index:4;pointer-events:none;
}

@media(max-width:700px){
  .rail{padding:12px;border-radius:46%}
  .felt{border-radius:46%}
  .avatar{width:44px;height:44px}
  .seat{width:78px}
  .card{width:34px;height:50px}
  .hero{bottom:122px}
  .hero .card{width:42px;height:62px}
  .actions button{min-width:86px;font-size:11px;padding:10px 8px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">OMAHA 5</div>
    <div class="meta">Sala <span id="roomLabel">-</span> · Saldo <span class="money" id="credits">0</span></div>
    <div class="status" id="connStatus">Desconectado</div>
  </div>

  <div class="lobby" id="connectPanel">
    <div class="row">
      <input id="name" placeholder="Seu nome" maxlength="18">
      <input id="room" placeholder="Sala (ex.: 1234)" maxlength="12">
      <button id="join">ENTRAR</button>
    </div>
  </div>

  <div class="stage">
    <div class="felt-wrap">
      <div class="rail">
        <div class="felt">
          <div class="felt-logo">OMAHA 5</div>
          <div class="pot" id="pot">Pote 0</div>
          <div class="board" id="board"></div>
          <div id="seats"></div>
        </div>
      </div>
    </div>
    <div class="hero" id="heroCards"></div>
    <div class="log" id="log"></div>
    <div class="bottom" id="gamePanel" style="display:none">
      <div class="betrow">
        <input id="bet" type="number" min="1" step="1" placeholder="Valor da aposta">
        <button class="ok" id="confirmBet">CONFIRMAR</button>
        <button class="ghost" id="leave">SAIR</button>
      </div>
      <div class="actions">
        <button id="start">NOVA RODADA</button>
        <button class="secondary" id="flop">ABRIR FLOP</button>
        <button class="ok" id="play">DISPUTAR</button>
        <button class="danger" id="fold">DESISTIR</button>
        <button class="secondary" id="turn">TURN</button>
        <button class="secondary" id="river">RIVER</button>
      </div>
    </div>
  </div>
</div>

<script>
let ws=null, myId=null, state=null;
const $=id=>document.getElementById(id);
function clockColor(sec){ if(sec>12) return 'green'; if(sec>6) return 'orange'; return 'red'; }
function updateClock(){
  const el=document.querySelector('[data-clock]');
  if(!el || !state || !state.turnEndsAt) return;
  const total=state.turnMs||18000;
  const left=Math.max(0, state.turnEndsAt - Date.now());
  const sec=Math.ceil(left/1000);
  el.className='clock '+clockColor(sec);
  el.style.setProperty('--p', (left/total)*100);
  const n=el.querySelector('.clock-num');
  if(n) n.textContent=sec;
}
setInterval(updateClock, 200);
const suits={S:'♠',H:'♥',D:'♦',C:'♣'};
function cardHtml(c,hidden=false,small=false){
  if(hidden||!c) return `<div class="card back"${small?' style="width:16px;height:24px"':''}></div>`;
  const red=c.s==='H'||c.s==='D'?' red':'';
  return `<div class="card${red}"><span>${c.r}</span><span class="suit">${suits[c.s]}</span></div>`;
}
function log(msg){
  const el=$('log'); el.innerHTML += `<div>${msg}</div>`; el.scrollTop=el.scrollHeight;
}
function send(type,payload={}){ if(ws&&ws.readyState===1) ws.send(JSON.stringify({type,...payload})); }
function initials(name){ return (name||'?').trim().slice(0,2).toUpperCase(); }
function seatOrder(players){
  const i=players.findIndex(p=>p.id===myId);
  if(i<0) return players;
  return [...players.slice(i), ...players.slice(0,i)];
}
function render(){
  if(!state)return;
  $('gamePanel').style.display='block';
  $('connectPanel').style.display='none';
  $('roomLabel').textContent=state.room;
  const me=state.players.find(p=>p.id===myId);
  $('credits').textContent=me?me.credits:0;
  const pot=(state.players||[]).reduce((s,p)=>s+(p.bet||0),0);
  $('pot').textContent='Pote '+pot;
  $('board').innerHTML=(state.board||[]).map(c=>cardHtml(c)).join('') + Array.from({length:Math.max(0,5-(state.board||[]).length)},()=>cardHtml(null,true)).join('');
  const reveal=state.stage==='showdown';
  const ordered=seatOrder(state.players||[]);
  let html='';
  for(let i=0;i<6;i++){
    const p=ordered[i];
    if(!p){
      html+=`<div class="seat s${i} empty"><div class="avatar">+</div><div class="plate"><b>Vazio</b><div class="chips">—</div></div></div>`;
      continue;
    }
    const mine=p.id===myId;
    const open=mine||reveal;
    const folded=p.decision==='fold';
    const acting=state.actorId===p.id && state.stage==='flop';
    const mini=(!mine && (p.hand||[]).length)? `<div class="mini-cards seat-cards">${(p.hand||[]).slice(0,5).map(c=>cardHtml(c,!open||!c,true)).join('')}</div>`:'';
    const face=acting
      ? `<div class="clock green" data-clock="1"><div class="avatar">${initials(p.name)}</div><div class="clock-num">18</div></div>`
      : `<div class="avatar">${initials(p.name)}</div>`;
    html+=`<div class="seat s${i} ${mine?'me':''} ${p.winner?'win':''} ${folded?'fold':''}">
      ${face}
      <div class="plate"><b>${p.name}</b><div class="chips">${p.credits}</div></div>
      ${mine?'':mini}
    </div>`;
  }
  $('seats').innerHTML=html;
  const myHand=me&&me.hand&&me.hand.length?me.hand:[];
  $('heroCards').innerHTML=myHand.map(c=>cardHtml(c,false)).join('');
  const host=state.hostId===myId;
  const s=state.stage;
  const decided=me && me.decision;
  $('start').disabled=!host || !(s==='idle'||s==='betting'||s==='showdown'||s==='folded');
  $('confirmBet').disabled=s!=='betting' || !!(me && me.bet);
  $('bet').disabled=s!=='betting' || !!(me && me.bet);
  $('flop').disabled=!host || s!=='preflop';
  const myTurn=s==='flop' && state.actorId===myId && !decided;
  $('play').disabled=!myTurn;
  $('fold').disabled=!myTurn;
  updateClock();
  $('turn').disabled=!host || s!=='live';
  $('river').disabled=!host || s!=='turn';
}
$('join').onclick=()=>{
  const name=$('name').value.trim()||'Jogador';
  const room=$('room').value.trim()||'1234';
  ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);
  $('connStatus').textContent='Conectando...';
  ws.onopen=()=>send('join',{name,room});
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==='joined'){myId=m.id;$('connStatus').textContent='Na sala';log('Entrou na sala '+m.room);}
    if(m.type==='state'){state=m.state;render();}
    if(m.type==='log')log(m.message);
    if(m.type==='error')log('Erro: '+m.message);
  };
  ws.onclose=()=>{$('connStatus').textContent='Desconectado';log('Conexão encerrada.');};
};
$('start').onclick=()=>send('start');
$('confirmBet').onclick=()=>send('bet',{amount:$('bet').value});
$('flop').onclick=()=>send('reveal',{stage:'flop'});
$('play').onclick=()=>send('decision',{choice:'play'});
$('fold').onclick=()=>send('decision',{choice:'fold'});
$('turn').onclick=()=>send('reveal',{stage:'turn'});
$('river').onclick=()=>send('reveal',{stage:'river'});
$('leave').onclick=()=>{ if(ws)ws.close(); $('gamePanel').style.display='none'; $('connectPanel').style.display='block'; };
</script>
</body>
</html>
