<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omaha 5 Multiplayer V4</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#071b16;color:#fff}
.app{max-width:920px;margin:auto;padding:12px}
h1{text-align:center;margin:6px 0;color:#ffd54a}
.sub{text-align:center;color:#b7d8cf;margin-bottom:10px}
.panel{background:#0e3127;border:1px solid #296b58;border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,button{border-radius:9px;border:0;padding:10px;font-size:15px}
input{flex:1;min-width:130px}
button{background:#f2c037;color:#172019;font-weight:bold;cursor:pointer}
button.secondary{background:#2474d8;color:white}
button.danger{background:#c33;color:white}
button:disabled{opacity:.45}
.status{padding:9px;border-radius:8px;background:#09231c;margin-top:8px;color:#d7fff4}
.table{background:radial-gradient(circle,#15704e,#0d4935 65%,#072a20);border:5px solid #6d4525;border-radius:120px;padding:18px;min-height:300px}
.cards{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.card{width:58px;height:82px;background:white;color:#111;border-radius:8px;padding:5px;font-weight:bold;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 5px #0008}
.red{color:#d22}
.back{background:linear-gradient(135deg,#183b7f,#2b58b7);border:3px solid #fff;color:white;justify-content:center;align-items:center}
.player{background:#0a251d;border:1px solid #2d8068;border-radius:10px;padding:8px;margin:7px 0}
.player.me{outline:2px solid #ffd54a}
.player.win{outline:3px solid #31e56f}
.board-title{text-align:center;font-weight:bold;color:#ffe789}
.small{font-size:12px;color:#b6d5cd}
.money{font-weight:bold;color:#7dffae}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.log{height:130px;overflow:auto;background:#061814;border-radius:8px;padding:8px;font-size:12px}
@media(max-width:600px){.card{width:48px;height:70px}.app{padding:7px}button,input{font-size:13px;padding:9px}}
</style>
</head>
<body>
<div class="app">
<h1>OMAHA 5 MULTIPLAYER V4</h1>
<div class="sub">Créditos fictícios • sem valor monetário</div>

<div class="panel" id="connectPanel">
  <div class="row">
    <input id="name" placeholder="Seu nome" maxlength="18">
    <input id="room" placeholder="Sala (ex.: 1234)" maxlength="12">
    <button id="join">ENTRAR NA SALA</button>
  </div>
  <div class="status" id="connStatus">Desconectado.</div>
</div>

<div class="panel" id="gamePanel" style="display:none">
  <div class="row">
    <div style="flex:1"><b>Sala:</b> <span id="roomLabel">-</span></div>
    <div><b>Seu saldo:</b> <span class="money" id="credits">1000</span></div>
  </div>
  <div class="actions" style="margin-top:8px">
    <button id="start">NOVA RODADA</button>
    <button class="secondary" id="flop">ABRIR FLOP</button>
    <button class="secondary" id="turn">ABRIR TURN</button>
    <button class="secondary" id="river">ABRIR RIVER</button>
    <button class="danger" id="leave">SAIR</button>
  </div>
</div>

<div class="table">
  <div class="board-title">MESA</div>
  <div class="cards" id="board"></div>
  <div id="players"></div>
</div>

<div class="panel">
  <b>Mensagens da sala</b>
  <div class="log" id="log"></div>
</div>
</div>

<script>
let ws=null, myId=null, state=null;
const $=id=>document.getElementById(id);
const suits={S:'♠',H:'♥',D:'♦',C:'♣'};
function cardHtml(c,hidden=false){
  if(hidden||!c) return '<div class="card back">OMAHA</div>';
  const red=c.s==='H'||c.s==='D'?' red':'';
  return `<div class="card${red}"><span>${c.r}${suits[c.s]}</span><span style="font-size:28px;text-align:center">${suits[c.s]}</span><span style="text-align:right">${c.r}</span></div>`;
}
function log(msg){
  const el=$('log'); el.innerHTML += `<div>${new Date().toLocaleTimeString()} — ${msg}</div>`; el.scrollTop=el.scrollHeight;
}
function send(type,payload={}){ if(ws&&ws.readyState===1) ws.send(JSON.stringify({type,...payload})); }
function render(){
  if(!state)return;
  $('gamePanel').style.display='block';
  $('roomLabel').textContent=state.room;
  const me=state.players.find(p=>p.id===myId);
  $('credits').textContent=me?me.credits:0;
  $('board').innerHTML=state.board.map(cardHtml).join('') + Array.from({length:5-state.board.length},()=>cardHtml(null,true)).join('');
  $('players').innerHTML=state.players.map(p=>{
    const visible=p.id===myId || state.stage==='showdown';
    const cards=visible?p.hand.map(c=>cardHtml(c)).join(''):p.hand.map(()=>cardHtml(null,true)).join('');
    return `<div class="player ${p.id===myId?'me':''} ${p.winner?'win':''}">
      <div><b>${p.name}${p.id===myId?' (você)':''}</b> — <span class="money">${p.credits}</span> créditos</div>
      <div class="small">${p.connected?'online':'offline'} ${p.result? ' • '+p.result:''}</div>
      <div class="cards">${cards}</div>
    </div>`;
  }).join('');
  const host=state.hostId===myId;
  $('start').disabled=!host;
  $('flop').disabled=!host || state.stage!=='preflop';
  $('turn').disabled=!host || state.stage!=='flop';
  $('river').disabled=!host || state.stage!=='turn';
}
$('join').onclick=()=>{
  const name=$('name').value.trim()||'Jogador';
  const room=$('room').value.trim()||'1234';
  ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);
  $('connStatus').textContent='Conectando...';
  ws.onopen=()=>send('join',{name,room});
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==='joined'){myId=m.id;$('connStatus').textContent='Conectado à sala '+m.room;log('Você entrou na sala '+m.room);}
    if(m.type==='state'){state=m.state;render();}
    if(m.type==='log')log(m.message);
    if(m.type==='error')log('Erro: '+m.message);
  };
  ws.onclose=()=>{$('connStatus').textContent='Desconectado.';log('Conexão encerrada.');};
};
$('start').onclick=()=>send('start');
$('flop').onclick=()=>send('reveal',{stage:'flop'});
$('turn').onclick=()=>send('reveal',{stage:'turn'});
$('river').onclick=()=>send('reveal',{stage:'river'});
$('leave').onclick=()=>{ if(ws)ws.close(); $('gamePanel').style.display='none'; };
</script>
</body>
</html>
