<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Poker da Galera</title>
<script src="/config.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;min-height:100%;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#05070c;color:#fff}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:430px;margin:auto;padding:12px 12px 24px}
.auth-page{max-width:none;padding:0;min-height:100vh}
.auth-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px 16px;background:#05070c center/cover no-repeat;
}
.logo{display:block;width:168px;height:168px;margin:0 auto 6px;object-fit:contain;filter:drop-shadow(0 8px 24px #000c)}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.brand-row{display:flex;align-items:center;gap:10px;flex:1;min-width:160px}
.brand-logo{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid #c9a35a88}
.brand{font-weight:800;color:#f3d27a;font-size:15px;letter-spacing:.4px;line-height:1.15}
.brand small{display:block;color:#8fa3bb;font-weight:600;font-size:11px;letter-spacing:.8px}
.saldo{background:#0e1420;border:1px solid #c9a35a44;border-radius:12px;padding:8px 12px;font-size:13px}
.saldo b{color:#f3d27a}
button,input{border:0;border-radius:12px;padding:14px 12px;font-size:16px}
button{font-weight:800;cursor:pointer;background:linear-gradient(180deg,#f6d56a,#d4a42a);color:#1a1406;min-height:48px;box-shadow:0 2px 0 #8a6a12;transition:transform .08s ease,opacity .08s}
button:active{transform:scale(.97)}
button.sec{background:#1a2436;color:#e8eef8;box-shadow:none;border:1px solid #2c3a58}
button.ok{background:#1fa65a;color:#fff;box-shadow:none}
button.danger{background:#c43333;color:#fff;box-shadow:none}
input{background:#0f1726;color:#fff;width:100%;margin:8px 0;min-height:48px;border:1px solid #2c3a58}
input:focus{outline:1px solid #c9a35a88}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.tcard{
  display:grid;grid-template-columns:88px 1fr auto;gap:12px;align-items:center;
  background:linear-gradient(180deg,#121a28,#0c121c);
  border:1px solid #2a384f;border-radius:16px;padding:10px;
  box-shadow:0 8px 20px #0006;
}
.tthumb{
  width:88px;height:64px;border-radius:12px;overflow:hidden;
  border:1px solid #c9a35a55;background:transparent;flex:none;
}
.tthumb img{width:100%;height:100%;object-fit:cover;display:block}
.tcard h3{margin:0;color:#f6e7b8;font-size:16px;font-weight:800}
.tmeta{color:#8fa3bb;font-size:12px;margin-top:2px}
.tbuy{text-align:right;color:#7dffae;font-weight:800;font-size:15px;line-height:1.2}
.tbuy span{display:block;color:#8fa3bb;font-size:10px;font-weight:600}
.tcard button{min-height:40px;padding:8px 14px;font-size:13px;border-radius:10px}
.auth{
  width:100%;max-width:400px;margin:0 auto;
  background:linear-gradient(180deg,#121820ee,#0a0e16f2);
  backdrop-filter:blur(16px);
  padding:18px 18px 22px;border-radius:22px;
  border:1px solid #c9a35a55;
  box-shadow:0 20px 50px #000c, inset 0 1px 0 #ffffff14;
}
.auth .tag{text-align:center;color:#c9a35a;letter-spacing:2px;font-size:11px;font-weight:800;margin:0 0 12px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:12px;z-index:20}
.modal.show{display:flex}
.box{background:#121a2c;border:1px solid #2c3a58;border-radius:16px;padding:18px;width:min(460px,96vw)}
.box.rules{width:min(640px,96vw);max-height:88vh;display:flex;flex-direction:column}
.rules-body{overflow:auto;flex:1;padding-right:6px;font-size:13px;line-height:1.45;color:#d7e2f0}
.rules-body h3{color:#ffd24a;margin:14px 0 6px;font-size:14px}
.rules-body p, .rules-body li{margin:0 0 6px;color:#c5d3e6}
.rules-body ul{margin:0 0 8px;padding-left:18px}
.checkline{display:flex;gap:8px;align-items:flex-start;margin:10px 0;font-size:13px;color:#c5d3e6}
.checkline input{width:auto;margin:3px 0 0}
.pix{background:#0b1220;border-radius:10px;padding:10px;margin:8px 0;word-break:break-all}
.muted{color:#9db0c8;font-size:13px}
.err{color:#ff8b8b;font-size:13px;min-height:18px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const TABLES = [
  {id:'iniciante', name:'Iniciante', buy:10, blinds:'0,25 / 0,50'},
  {id:'mediana', name:'Mediana', buy:25, blinds:'0,50 / 1,00'},
  {id:'dificil', name:'Difícil', buy:55, blinds:'1,00 / 2,00'},
  {id:'semipro', name:'Semipro', buy:100, blinds:'2,00 / 5,00'},
  {id:'profissional', name:'Profissional', buy:200, blinds:'5,00 / 10,00'}
];
function tableThumb(t){
  return `<img src="/assets/tables/${t.id}.png" alt="${t.name}">`;
}
const brl = n => 'R$ ' + Number(n||0).toFixed(2).replace('.',',');
let token=localStorage.getItem('pdg_token')||'', profile=null, rulesRead=false, rulesAccepted=false, authMode='login';
async function api(path, body, method){
  const opt={ method: method|| (body?'POST':'GET'), headers:{ 'Content-Type':'application/json' } };
  if(token) opt.headers.Authorization='Bearer '+token;
  if(body) opt.body=JSON.stringify(body);
  const r=await fetch(path, opt);
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||'Erro');
  return j;
}

function rulesHtml(){
  return `<h3>1. Aceitação</h3>
<p>Ao criar conta, entrar ou jogar no Poker da Galera, você declara ter lido, entendido e aceito estas regras na íntegra. Se não concordar, não utilize a plataforma.</p>
<h3>2. Idade e responsabilidade</h3>
<ul>
<li>O acesso é exclusivo para maiores de 18 anos.</li>
<li>Você é responsável por todas as ações feitas na sua conta.</li>
<li>Jogue apenas com dinheiro que pode perder. A plataforma não se responsabiliza por prejuízos de jogo.</li>
</ul>
<h3>3. Jogo limpo — trapaça é proibida</h3>
<p>É estritamente proibido qualquer tipo de trapaça, fraude ou conduta desleal, incluindo:</p>
<ul>
<li>Uso de bots, scripts, solvers em tempo real, HUDs não autorizados ou qualquer software de assistência.</li>
<li>Colusão: dois ou mais jogadores combinando jogadas, sinais, chip dumping ou divisão combinada de potes.</li>
<li>Multiaccounting: criar ou usar mais de uma conta, contas de terceiros ou contas para se beneficiar em mesas.</li>
<li>Compartilhar cartas, prints da mão ou informação privilegiada com quem está na mesma mesa.</li>
<li>Explorar bugs, falhas de conexão, atraso proposital ou qualquer erro do sistema em benefício próprio.</li>
<li>Manipular resultados, fingir desconexão para fugir de apostas ou prejudicar a mesa.</li>
<li>Usar linguagem ofensiva, ameaça, assédio, racismo, preconceito ou intimidação.</li>
</ul>
<h3>4. Conduta na mesa</h3>
<ul>
<li>Respeite os tempos de ação. Abandono repetido pode gerar kick ou bloqueio.</li>
<li>Não é permitido combinar fold, check ou raise com outros jogadores.</li>
<li>O jogo é <b>Omaha 5 (PLO5)</b>, limite pote: cada jogador recebe 5 cartas fechadas e o board tem 5 comunitárias (flop 3, turn 1, river 1).</li>
<li>A combinação válida é sempre <b>exatamente 2 cartas da mão + exatamente 3 comunitárias</b>. Não vale usar 1 ou 3 da mão.</li>
<li>Aposta máxima é o tamanho do pote (pot-limit). All-in só quando a stack cabe no pote ou é menor que o máximo.</li>
<li>Blinds, ordem de ação, check, call, raise e ruas seguem o Omaha 5 padrão. A decisão do sistema prevalece.</li>
</ul>
<h3>5. Conta, saldo, PIX, depósitos e saques</h3>
<ul>
<li>O saldo da conta é de uso exclusivo do titular.</li>
<li>Depósitos via PIX exigem comprovante enviado pelo WhatsApp (16) 99295-4354. O crédito só ocorre após conferência da equipe.</li>
<li>Comprovante falso, valor divergente ou PIX de terceiro sem identificação pode ser recusado e a conta bloqueada.</li>
<li>Saques exigem chave PIX válida do titular. O pedido retém o valor e o pagamento é processado após o prazo informado, com confirmação da equipe.</li>
<li>A plataforma pode reter, estornar ou cancelar valores ligados a fraude, chargeback, conta irregular ou violação destas regras.</li>
</ul>
<h3>6. Penalidades</h3>
<p>Em caso de violação, a equipe pode, sem aviso prévio:</p>
<ul>
<li>Advertir, suspender ou banir a conta de forma permanente.</li>
<li>Confiscar saldo, fichas em mesa, depósitos pendentes e saques.</li>
<li>Anular mãos, potes ou resultados obtidos de forma irregular.</li>
<li>Recusar novos cadastros do mesmo CPF, e-mail, dispositivo ou PIX.</li>
</ul>
<h3>7. Equipe e decisões</h3>
<ul>
<li>A administração do Poker da Galera tem a palavra final em denúncias, mesas, saldo e cadastros.</li>
<li>Falhas técnicas devem ser reportadas. Usar falha de propósito é violação grave.</li>
<li>Estas regras podem ser atualizadas. O uso contínuo após alteração implica aceitação.</li>
</ul>
<p><b>Ao marcar “Li e aceito”, você concorda em jogar limpo, sem trapaças, e assume as consequências de qualquer infração.</b></p>`;
}

function applyLoginArt(){
  const screen = document.querySelector('.auth-screen');
  const img = document.getElementById('logo');
  if(screen) screen.style.backgroundImage = 'linear-gradient(180deg,#05070c66 0%,#05070c88 42%,#05070cee 100%),url("/assets/login-bg.png")';
  if(img){ img.src='/assets/logo.png'; img.onerror=()=>{ img.style.display='none'; }; }
}
async function refresh(){
  if(!token){ renderAuth(); return; }
  try {
    profile = await api('/api/me');
    renderLobby();
  } catch(e) {
    token=''; localStorage.removeItem('pdg_token');
    renderAuth();
  }
}

function renderAuth(){
  const signup = authMode==='signup';
  const app = document.getElementById('app');
  app.className = 'auth-page';
  app.innerHTML = `<div class="auth-screen">
    <div class="auth">
    <img id="logo" class="logo" alt="Poker da Galera">
    <div class="tag">${signup?'CRIAR CONTA':'ENTRAR'}</div>
    ${signup?`<input id="user" placeholder="Nome de usuário" maxlength="18" autocomplete="username">`:''}
    <input id="email" type="email" placeholder="E-mail" autocomplete="email">
    <input id="pass" type="password" placeholder="Senha" autocomplete="${signup?'new-password':'current-password'}">
    ${signup?`
    <label class="checkline"><input type="checkbox" id="age"> Tenho 18 anos ou mais</label>
    <button class="sec" type="button" onclick="openRules()" style="width:100%">Ler regras da plataforma</button>
    <label class="checkline"><input type="checkbox" id="rules"> Li e aceito as regras da plataforma (proibido trapaça, colusão, multiaccount e fraude)</label>
    `:''}
    <div class="err" id="err"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      ${signup
        ? `<button onclick="signup()" style="flex:1">Cadastrar</button><button class="sec" onclick="authMode='login';renderAuth()">Já tenho conta</button>`
        : `<button onclick="login()" style="flex:1">Entrar</button><button class="sec" onclick="authMode='signup';renderAuth()">Cadastrar</button>`}
    </div>
    <div class="modal" id="rulesModal"><div class="box rules">
      <h3 style="margin:0 0 8px;color:#ffd24a">Regras da plataforma</h3>
      <div class="rules-body" id="rulesBody">${rulesHtml()}</div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="ok" onclick="acceptRules()">Li e aceito</button>
        <button class="sec" onclick="closeRules()">Fechar</button>
      </div>
    </div></div>
  </div>
  </div>`;
  if(signup) syncRulesCheck();
  applyLoginArt();
}
function openRules(){
  rulesRead = true;
  $('rulesModal').classList.add('show');
}
function closeRules(){ $('rulesModal').classList.remove('show'); }
function acceptRules(){
  rulesRead = true;
  rulesAccepted = true;
  $('rules').checked = true;
  closeRules();
}
function syncRulesCheck(){
  const el = $('rules');
  if(!el) return;
  el.onchange = () => {
    if(el.checked && !rulesRead){
      el.checked = false;
      $('err').textContent = 'Abra e leia as regras antes de aceitar.';
      openRules();
      return;
    }
    rulesAccepted = el.checked;
  };
}
async function login(){
  const email = ($('email').value||'').trim();
  const password = $('pass').value||'';
  if(!email || !password){ $('err').textContent='Informe e-mail e senha.'; return; }
  try {
    const data = await api('/api/login', { email, password });
    token = data.token; localStorage.setItem('pdg_token', token);
    profile = data.user; renderLobby();
  } catch(e) { $('err').textContent = e.message; }
}
async function signup(){
  const username = ($('user').value||'').trim();
  const email = ($('email').value||'').trim();
  const password = $('pass').value||'';
  if(!username){ $('err').textContent='Informe o nome de usuário.'; return; }
  if(!email){ $('err').textContent='Informe o e-mail.'; return; }
  if(password.length < 6){ $('err').textContent='A senha deve ter pelo menos 6 caracteres.'; return; }
  if(!$('age').checked){ $('err').textContent='Confirme que tem 18 anos.'; return; }
  if(!rulesRead || !$('rules').checked){ $('err').textContent='Leia e aceite as regras da plataforma para se cadastrar.'; openRules(); return; }
  try {
    const data = await api('/api/register', { email, username, password });
    if(data.token){ token=data.token; localStorage.setItem('pdg_token', token); profile=data.user; renderLobby(); return; }
    authMode='login'; renderAuth();
    $('err').textContent='Conta criada. Entre com e-mail e senha.';
  } catch(e) { $('err').textContent = e.message; }
}
function $(id){ return document.getElementById(id); }

function renderLobby(){
  const admin = profile && profile.role==='admin' ? `<a href="/admin.html"><button class="sec">Admin</button></a>` : '';
  const app = document.getElementById('app');
  app.className = 'wrap';
  app.innerHTML = `
    <div class="top">
      <div class="brand-row">
        <img class="brand-logo" src="/assets/logo.png" alt="">
        <div class="brand">POKER DA GALERA<small>OMAHA 5 · MESAS AO VIVO</small></div>
      </div>
      <div class="saldo">Saldo <b>${brl(profile&&profile.balance)}</b></div>
      <button onclick="openWallet()">Carteira</button>
      ${admin}
      <button class="sec" onclick="logout()">Sair</button>
    </div>
    <p class="muted">Escolha a mesa. O buy-in sai do saldo. <a href="#" onclick="openRulesLobby();return false;" style="color:#f3d27a">Regras</a></p>
    <div class="grid">${TABLES.map(t=>`
      <div class="tcard">
        <div class="tthumb">${tableThumb(t)}</div>
        <div>
          <h3>${t.name}</h3>
          <div class="tmeta">Blinds ${t.blinds} · 6 jogadores</div>
        </div>
        <div>
          <div class="tbuy">${brl(t.buy)}<span>BUY-IN</span></div>
          <button style="margin-top:6px;width:100%" onclick="sit('${t.id}',${t.buy})">Sentar</button>
        </div>
      </div>`).join('')}</div>
    <div class="modal" id="wallet"><div class="box" id="walletBox"></div></div>
    <div class="modal" id="rulesModal"><div class="box rules">
      <h3 style="margin:0 0 8px;color:#ffd24a">Regras da plataforma</h3>
      <div class="rules-body">${rulesHtml()}</div>
      <div style="margin-top:12px"><button class="sec" onclick="document.getElementById('rulesModal').classList.remove('show')">Fechar</button></div>
    </div></div>`;
  if(new URLSearchParams(location.search).get('add')==='1'){
    setTimeout(()=>{ openWallet(); walletView('add'); }, 50);
  }
}
function openRulesLobby(){ document.getElementById('rulesModal').classList.add('show'); }

function sit(id, buy){
  if(!profile || Number(profile.balance) < buy){ alert('Saldo insuficiente. Use a carteira para adicionar.'); return; }
  location.href = '/game.html?table='+id;
}

function openWallet(){
  $('wallet').classList.add('show');
  walletView('home');
  $('wallet').onclick = e => { if(e.target.id==='wallet') $('wallet').classList.remove('show'); };
}
function walletView(mode){
  if(mode==='home'){
    $('walletBox').innerHTML = `<h3>Carteira</h3><p>Saldo ${brl(profile.balance)}</p>
      <button class="ok" onclick="walletView('add')">Adicionar</button>
      <button class="sec" onclick="walletView('out')">Sacar</button>
      <button class="sec" onclick="$('wallet').classList.remove('show')">Fechar</button>
      <div id="hist"></div>`;
    loadHist();
  }
  if(mode==='add'){
    $('walletBox').innerHTML = `<h3>Adicionar saldo</h3>
      <p class="muted">PIX instantâneo. Mínimo R$ 2,00. O saldo entra automaticamente após o pagamento.</p>
      <input id="depAmt" type="number" min="2" step="0.01" placeholder="Valor (R$)">
      <input id="depCpf" placeholder="CPF" inputmode="numeric">
      <div class="err" id="werr"></div>
      <button class="ok" onclick="createPixCharge()">Gerar PIX</button>
      <button class="sec" onclick="walletView('home')">Voltar</button>`;
  }
  if(mode==='out'){
    $('walletBox').innerHTML = `<h3>Saque</h3>
      <p class="muted">PIX enviado na hora pela CajuPay. Mínimo R$ 2,00. Informe a chave e o CPF do titular.</p>
      <input id="pixOut" placeholder="Sua chave PIX">
      <input id="outCpf" placeholder="CPF do titular da chave" inputmode="numeric">
      <input id="outAmt" type="number" min="2" step="0.01" placeholder="Valor (R$)">
      <div class="err" id="werr"></div>
      <button class="ok" onclick="sendWithdraw()">Sacar via PIX</button>
      <button class="sec" onclick="walletView('home')">Voltar</button>`;
  }
}
let pixPoll = null;
async function createPixCharge(){
  const amount = Number($('depAmt').value);
  const document = ($('depCpf').value || '').replace(/\D/g,'');
  $('werr').textContent = '';
  try {
    const r = await api('/api/pix', { amount, document });
    showPixPay(r);
  } catch(e) { $('werr').textContent = e.message; }
}
function pixQrSrc(qr){
  const s = String(qr||'').trim();
  if(!s) return '';
  if(/^https?:\/\//i.test(s) || s.startsWith('data:')) return s;
  return 'data:image/png;base64,'+s.replace(/^data:image\/\w+;base64,/,'');
}
function showPixPay(r){
  if(pixPoll) clearInterval(pixPoll);
  const qr = pixQrSrc(r.qr);
  $('walletBox').innerHTML = `<h3>Pague o PIX</h3>
    ${qr?`<img alt="QR PIX" src="${qr}" style="width:220px;height:220px;display:block;margin:8px auto;background:#fff;border-radius:8px">`:''}
    <p class="muted">Copie o código e pague no app do banco. Esta tela atualiza sozinha.</p>
    <div class="pix" id="pixCopy">${r.copyPaste||''}</div>
    <button class="ok" onclick="navigator.clipboard.writeText($('pixCopy').textContent)">Copiar código</button>
    <div class="err" id="werr"></div>
    <p class="muted" id="pixSt">Aguardando pagamento…</p>
    <button class="sec" onclick="stopPixPoll();walletView('home')">Voltar</button>`;
  pixPoll = setInterval(()=>checkPix(r.id), 2500);
}
function stopPixPoll(){ if(pixPoll){ clearInterval(pixPoll); pixPoll=null; } }
async function checkPix(id){
  try {
    const s = await api('/api/pix/status/'+id);
    if(s.status==='approved'){
      stopPixPoll();
      if(s.balance!=null) profile.balance = s.balance;
      await refresh();
      openWallet();
      const box=$('walletBox');
      if(box) box.innerHTML = `<h3>Pagamento confirmado</h3><p>Saldo ${brl(profile.balance)}</p>
        <button class="ok" onclick="walletView('home')">Ok</button>`;
    }
  } catch(e) { const el=$('werr'); if(el) el.textContent=e.message; }
}
async function sendWithdraw(){
  const amount = Number($('outAmt').value);
  const pixKey = $('pixOut').value.trim();
  const cpf = ($('outCpf').value || '').replace(/\D/g,'');
  const errEl = $('werr');
  if(errEl) errEl.textContent = '';
  try {
    const r = await api('/api/withdraw', { amount, pixKey, document: cpf });
    if(r.balance!=null) profile.balance = r.balance;
    const saldo = document.querySelector('.saldo b');
    if(saldo) saldo.textContent = brl(profile.balance);
    $('walletBox').innerHTML = `<h3>Saque enviado</h3>
      <p>O PIX de ${brl(amount)} foi disparado pela CajuPay.</p>
      <p>Saldo ${brl(profile.balance)}</p>
      <button class="ok" onclick="walletView('home')">Ok</button>`;
  } catch(e) {
    const el = $('werr');
    if(el) el.textContent = e.message;
    else alert(e.message);
  }
}
async function loadHist(){
  try {
    const box = $('walletBox');
    const h = await api('/api/history');
    const el = $('hist');
    if(!el || $('walletBox')!==box) return;
    el.innerHTML = `<p class="muted">Depósitos</p>${(h.deposits||[]).map(x=>`<div class="muted">${brl(x.amount)} · ${x.status}</div>`).join('')}
      <p class="muted">Saques</p>${(h.withdrawals||[]).map(x=>`<div class="muted">${brl(x.amount)} · ${x.status}</div>`).join('')}`;
  } catch(e) { const el=$('hist'); if(el) el.innerHTML=''; }
}
async function logout(){
  try { await api('/api/logout', {}); } catch(_){}
  token=''; localStorage.removeItem('pdg_token'); location.reload();
}
refresh();
</script>
</body>
</html>
